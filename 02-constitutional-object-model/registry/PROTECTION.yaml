schema_version: 0.3.0
object_type: PROTECTION

description: >
  Constitutionally protected condition against deprivation or interference.

required:
  - object_id
  - source_locator
  - source_class
  - object_type
  - derivation_status

derivation_status:
  allowed:
    - EXPLICIT_SOURCE
    - SOURCE_DECOMPOSITION
    - DERIVED_INTERPRETATION

rules:
  source_identity_required: true
  provenance_required: true
  silent_source_mutation_prohibited: true
  interpretation_must_be_separately_typed: true

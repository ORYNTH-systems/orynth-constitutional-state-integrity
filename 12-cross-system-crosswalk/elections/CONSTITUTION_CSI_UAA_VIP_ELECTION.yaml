schema_version: 0.4.0
crosswalk: CONSTITUTION_CSI_UAA_VIP_ELECTION

CONSTITUTION:
  owns:
    - SOURCE
    - FOUNDATIONAL_POWER
    - FOUNDATIONAL_RIGHT
    - FOUNDATIONAL_PROHIBITION
    - FOUNDATIONAL_QUALIFICATION
    - FOUNDATIONAL_JURISDICTION

CSI:
  owns:
    - SOURCE_IDENTITY
    - OBJECT_TYPING
    - PREDICATE_RESOLUTION
    - DEPENDENCY
    - DERIVED_AUTHORITY_LINEAGE
    - PREDICATE_EQUIVALENCE
    - DETERMINISTIC_RELEVANCE
    - CONFLICT_STATE

UAA:
  owns:
    - PRINCIPAL
    - DELEGATION
    - ACTOR_AUTHORITY
    - AUTHORITY_SCOPE
    - CONSEQUENCE_AUTHORIZATION

VIP:
  owns:
    - VOTER_DOMAIN_STATE
    - ELIGIBILITY_EXECUTION
    - REGISTRATION
    - BALLOT_ADMISSION
    - TABULATION
    - CERTIFICATION
    - ELECTION_FINALITY

invariant:
  no_downstream_layer_may_silently_redefine_upstream_constitutional_source: true

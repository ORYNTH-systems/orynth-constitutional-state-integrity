schema_version: 0.5.0
contract: UAA_ELECTION_DELEGATION

delegation_requires:
  - valid_principal
  - delegable_operation
  - identifiable_delegate
  - scope
  - jurisdiction
  - duration
  - revocation_state
  - provenance

agentic_delegate:
  permitted: CONDITIONAL

agentic_delegate_may_not:
  - EXPAND_SOURCE_AUTHORITY
  - EXPAND_JURISDICTION
  - REDEFINE_ELIGIBILITY
  - CREATE_CONSTITUTIONAL_QUALIFICATION
  - CREATE_FINALITY
  - SELF_AUTHORIZE_ADVERSE_CONSEQUENCE

rule:
  delegated_execution_cannot_exceed_principal_authority: true
